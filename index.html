<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Proyecto 10 - Tabs</title>
    <link rel='stylesheet' href='css/estilos.css'>
</head>
<body>
    <div class="caja">
        <div class="menu">
            <button class="boton activo" data-tab="tab1">First Tab</button>
            <button class="boton" data-tab="tab2">Second Tab</button>
            <button class="boton" data-tab="tab3">Third Tab</button>
            <button class="boton" data-tab="tab4">Fourth Tab</button>
        </div>

        <div id="tab1" class="contenido activo">First Tab content to be displayed here.</div>
        <div id="tab2" class="contenido">Second Tab content to be displayed here.</div>
        <div id="tab3" class="contenido">Third Tab content to be displayed here.</div>
        <div id="tab4" class="contenido">Fourth Tab content to be displayed here.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
